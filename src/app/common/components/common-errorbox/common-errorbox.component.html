<div class="flex flex-col mb-2 gap-4 items-center text-left">
    <ul class="text-left list-disc">
        @for (item of message(); track item) {
            <li>{{ item }}</li>
        }
    </ul>
</div>
<div class="grid grid-cols-2 gap-6 mb-6"></div>
<div class="flex gap-12 justify-center">
    <p-button label="Exit" (click)="onYes()" />
    <!-- <p-button label="Exit" severity="secondary" (click)="onCancel()" /> -->
</div>
