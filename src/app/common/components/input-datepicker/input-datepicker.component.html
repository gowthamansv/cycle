<div class="flex flex-col gap-2">
    <label [for]="label()" [class.p-error]="hasError()" class="font-semibold">{{
        computdLabel()
    }}</label>
    <p-datepicker
        appendTo="body"
        [inputId]="label()"
        [class.ng-invalid]="hasError()"
        [class.ng-dirty]="hasError()"
        [formControl]="ngControl.control"
        [showIcon]="showIcon()"
        [dateFormat]="dateFormat()"
        [showButtonBar]="showButtonBar()"
        [showTime]="showTime()"
        [timeOnly]="timeOnly()"
        [readonlyInput]="true"
        [hourFormat]="hourFormat()"
        [selectionMode]="selectionMode()"
        [view]="view()"
        [minDate]="minDate()"
        [maxDate]="maxDate()"
        fluid
    />
    @if (hasError()) {
        <div class="p-error">
            @for (error of getErrors(); track error) {
                <small>{{ error }}</small> <br />
            }
        </div>
    }
</div>
